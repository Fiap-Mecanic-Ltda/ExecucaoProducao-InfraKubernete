# Requer o metrics-server (ja vem no k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execucao-service
  namespace: execucao
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: execucao-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execucao-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
